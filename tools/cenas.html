<!doctype html>
<html><head><meta charset="utf-8">
<style>body{margin:0;background:transparent}canvas{display:block}</style>
<script src="node_modules/three/build/three.min.js"></script>
</head><body>
<canvas id="out"></canvas>
<script>
// Cenas low-poly com cara de PS1/PS2 pro perfil. Cada cena expõe window.N e window.quadro(i) → dataURL.
const Q = new URLSearchParams(location.search);
const CENA = Q.get('cena') || 'heroi';
const TAU = Math.PI * 2;

// ---------- utilitários ----------
let semente = 7;
const rnd = () => { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; };

function textura(w, h, desenha) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  desenha(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// material com "tremida" de vértice do PS1 (posição presa numa grade de baixa resolução)
function psx(iw, ih, params, tipo = 'lambert') {
  const M = tipo === 'basic' ? THREE.MeshBasicMaterial : THREE.MeshLambertMaterial;
  const m = new M(params);
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>',
      `#include <project_vertex>
       vec2 grade = vec2(${(iw / 2).toFixed(1)}, ${(ih / 2).toFixed(1)});
       gl_Position.xy = floor(gl_Position.xy / gl_Position.w * grade + 0.5) / grade * gl_Position.w;`);
  };
  return m;
}

// pós: reduz cor (15 bits) com pontilhado Bayer, depois amplia sem suavizar
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function montar(gl, iw, ih, S, out, ctx) {
  const pc = montar.pc || (montar.pc = document.createElement('canvas'));
  pc.width = iw; pc.height = ih;
  const px = pc.getContext('2d');
  px.drawImage(gl, 0, 0);
  const im = px.getImageData(0, 0, iw, ih), d = im.data;
  for (let y = 0; y < ih; y++) for (let x = 0; x < iw; x++) {
    const k = (y * iw + x) * 4, b = (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5) * 8;
    for (let c = 0; c < 3; c++) d[k + c] = Math.max(0, Math.min(255, Math.round((d[k + c] + b) / 8) * 8));
  }
  px.putImageData(im, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(pc, 0, 0, iw * S, ih * S);
}

const SAT = Q.has('cor') ? 1 : .32;
function grade(ctx, W, H) {
  if (SAT >= 1) return;
  const im = ctx.getImageData(0, 0, W, H), d = im.data;
  for (let k = 0; k < d.length; k += 4) {
    const r0 = d[k], g0 = d[k + 1], b0 = d[k + 2], l = r0 * .3 + g0 * .59 + b0 * .11;
    const s0 = (r0 > g0 * 1.7 && r0 > b0 * 1.7) ? .85 : SAT;
    d[k] = l + (r0 - l) * s0 + 4; d[k + 1] = l + (g0 - l) * s0 + 1; d[k + 2] = l + (b0 - l) * s0 - 2;
  }
  ctx.putImageData(im, 0, 0);
}

function renderer(iw, ih) {
  const gl = document.createElement('canvas');
  const r = new THREE.WebGLRenderer({ canvas: gl, antialias: false, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(iw, ih, false);
  return r;
}

// texto Y2K cromado
function cromado(ctx, txt, x, y, tam, alinhar = 'left', brilho = null) {
  ctx.save();
  ctx.font = `italic 900 ${tam}px "Arial Black", "Helvetica Neue", sans-serif`;
  ctx.textAlign = alinhar; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.shadowColor = '#ff4fb6'; ctx.shadowBlur = tam * 0.28;
  ctx.lineWidth = tam * 0.16; ctx.strokeStyle = '#1a1446'; ctx.strokeText(txt, x, y);
  ctx.shadowBlur = 0;
  const g = ctx.createLinearGradient(0, y - tam, 0, y);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.45, '#bfe8ff'); g.addColorStop(.5, '#6f86c9'); g.addColorStop(.75, '#e6f4ff'); g.addColorStop(1, '#9fb3e8');
  ctx.fillStyle = g; ctx.fillText(txt, x, y);
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.strokeText(txt, x, y);
  ctx.restore();
  if (brilho === null || brilho < 0 || brilho > 1) return;
  // faixa de luz atravessando as letras
  const oc = cromado.oc || (cromado.oc = document.createElement('canvas'));
  oc.width = ctx.canvas.width; oc.height = ctx.canvas.height;
  const o = oc.getContext('2d');
  o.font = `italic 900 ${tam}px "Arial Black", "Helvetica Neue", sans-serif`; o.textAlign = alinhar;
  o.fillStyle = '#fff'; o.fillText(txt, x, y);
  o.globalCompositeOperation = 'source-in';
  const larg = o.measureText(txt).width, x0 = alinhar === 'left' ? x : x - larg / 2;
  const bx = x0 - tam + (larg + tam * 2) * brilho;
  const gb = o.createLinearGradient(bx - tam * .5, 0, bx + tam * .5, 0);
  gb.addColorStop(0, 'rgba(255,255,255,0)'); gb.addColorStop(.5, 'rgba(255,255,255,.95)'); gb.addColorStop(1, 'rgba(255,255,255,0)');
  o.fillStyle = gb; o.fillRect(0, 0, oc.width, oc.height);
  ctx.drawImage(oc, 0, 0);
}

// faixa de luz sobre um texto já desenhado (fonte dos títulos dos cartões)
function brilhoTexto(ctx, txt, x, y, tam, pos) {
  if (pos < 0 || pos > 1) return;
  const oc = brilhoTexto.oc || (brilhoTexto.oc = document.createElement('canvas'));
  oc.width = ctx.canvas.width; oc.height = ctx.canvas.height;
  const o = oc.getContext('2d');
  o.font = `italic 900 ${tam}px "Arial Black", sans-serif`; o.fillStyle = '#fff'; o.fillText(txt, x, y);
  o.globalCompositeOperation = 'source-in';
  const larg = o.measureText(txt).width, bx = x - tam + (larg + tam * 2) * pos;
  const g = o.createLinearGradient(bx - tam * .6, 0, bx + tam * .6, 0);
  g.addColorStop(0, 'rgba(255,138,192,0)'); g.addColorStop(.5, 'rgba(255,210,235,1)'); g.addColorStop(1, 'rgba(255,138,192,0)');
  o.fillStyle = g; o.fillRect(0, 0, oc.width, oc.height);
  ctx.drawImage(oc, 0, 0);
}

// neve/poeira: pontos que caem e voltam pro topo (laço fechado em N quadros)
function flocos(n, caixa, tam, cor) {
  const g = new THREE.BufferGeometry(), base = [];
  for (let k = 0; k < n; k++) base.push([caixa[0] + rnd() * (caixa[1] - caixa[0]), rnd(), caixa[4] + rnd() * (caixa[5] - caixa[4]), rnd() * TAU, 1 + (rnd() * 2 | 0)]);
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: cor, size: tam, sizeAttenuation: false }));
  p.mover = (t, sobe = false) => {
    const a = g.attributes.position;
    base.forEach(([x, y0, z, f, v], k) => {
      let y = (y0 + (sobe ? 1 : -1) * t * v) % 1; if (y < 0) y += 1;
      a.setXYZ(k, x + Math.sin(t * TAU * v + f) * .4, caixa[2] + y * (caixa[3] - caixa[2]), z);
    });
    a.needsUpdate = true;
  };
  return p;
}

// legenda amarela de jogo (contorno preto)
function legenda(ctx, txt, x, y, tam) {
  ctx.save();
  ctx.font = `${tam}px "Trebuchet MS", "Verdana", sans-serif`; ctx.textAlign = 'center';
  ctx.lineWidth = tam * 0.22; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round'; ctx.strokeText(txt, x, y);
  ctx.fillStyle = '#ffe23a'; ctx.fillText(txt, x, y);
  ctx.restore();
}

// aparelhinho Y2K com tela LCD (relógio + kaomoji)
function aparelho(ctx, x, y, w, h, relogio, cara, piscar) {
  ctx.save();
  const r = h / 2;
  const caps = (px, py, pw, ph, rr) => { ctx.beginPath(); ctx.roundRect(px, py, pw, ph, rr); };
  caps(x, y, w, h, r);
  let g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#f4f7ff'); g.addColorStop(.5, '#a9b6d6'); g.addColorStop(1, '#6d7ba6');
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#26305e'; ctx.stroke();
  caps(x + 6, y + 6, w - 12, h - 12, r - 6); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5; ctx.stroke();
  // botões
  [['#3a7bff', 0], ['#ff5fae', 1]].forEach(([c, i]) => {
    ctx.beginPath(); ctx.arc(x + r + i * (h * .42), y + h / 2, h * .16, 0, TAU);
    const gb = ctx.createRadialGradient(x + r + i * (h * .42) - 3, y + h / 2 - 3, 1, x + r + i * (h * .42), y + h / 2, h * .16);
    gb.addColorStop(0, '#fff'); gb.addColorStop(.35, c); gb.addColorStop(1, '#101848');
    ctx.fillStyle = gb; ctx.fill();
  });
  // LCD verde
  const lx = x + h * 1.25, lw = w - h * 1.25 - r * .9, ly = y + h * .2, lh = h * .6;
  caps(lx, ly, lw, lh, 6); ctx.fillStyle = '#0d2a14'; ctx.fill();
  caps(lx + 3, ly + 3, lw - 6, lh - 6, 4); ctx.fillStyle = '#123b1c'; ctx.fill();
  ctx.font = `bold ${lh * .62}px Menlo, monospace`; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#7dff8a'; ctx.shadowColor = '#7dff8a'; ctx.shadowBlur = 6;
  ctx.fillText(piscar ? relogio : relogio.replace(':', ' '), lx + 12, ly + lh / 2 + 1);
  ctx.fillStyle = '#ff6fb8'; ctx.shadowColor = '#ff6fb8'; ctx.textAlign = 'right';
  ctx.fillText(cara, lx + lw - 12, ly + lh / 2 + 1);
  ctx.restore();
}

function scan(ctx, W, H, forca = .14) {
  ctx.save(); ctx.fillStyle = `rgba(0,0,0,${forca})`;
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .7);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); ctx.restore();
}


// ---------- textura suja (cara de foto escaneada, estilo do MSA) ----------
function sujo(base, tam = 32, forca = 38, extra) {
  return textura(tam, tam, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    const im = c.getImageData(0, 0, w, h), d = im.data;
    for (let k = 0; k < w * h; k++) { const n = (rnd() - .5) * forca; d[k * 4] += n; d[k * 4 + 1] += n * .9; d[k * 4 + 2] += n * .8; }
    c.putImageData(im, 0, 0);
    for (let k = 0; k < 6; k++) { c.fillStyle = `rgba(20,10,10,${.08 + rnd() * .12})`; c.fillRect(rnd() * w | 0, rnd() * h | 0, 2 + rnd() * 6 | 0, 1 + rnd() * 4 | 0); }
    if (extra) extra(c, w, h);
  });
}
const veias = (c, w, h) => { c.strokeStyle = 'rgba(90,10,60,.8)'; c.lineWidth = 1; for (let k = 0; k < 5; k++) { c.beginPath(); let x = rnd() * w, y = rnd() * h; c.moveTo(x, y); for (let j = 0; j < 4; j++) { x += (rnd() - .5) * 12; y += (rnd() - .5) * 12; c.lineTo(x, y); } c.stroke(); } };

// HUD do sonho: pílula prateada com tela azul, relógio, item, maldições e um kaomoji vermelho
function hud(ctx, x, y, w, h, relogio, item, maldicao, cara, piscar) {
  ctx.save();
  const caps = (px, py, pw, ph, rr) => { ctx.beginPath(); ctx.roundRect(px, py, pw, ph, rr); };
  caps(x, y, w, h, h * .3);
  let g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#f2f4f8'); g.addColorStop(.5, '#b8bec9'); g.addColorStop(1, '#7c8494');
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#3a404c'; ctx.stroke();
  // botões azuis da esquerda
  [0, 1].forEach((k) => { const by = y + h * (.3 + k * .4); ctx.beginPath(); ctx.ellipse(x + h * .32, by, h * .13, h * .11, 0, 0, TAU);
    const gb = ctx.createRadialGradient(x + h * .3, by - 2, 1, x + h * .32, by, h * .13); gb.addColorStop(0, '#e8f6ff'); gb.addColorStop(.4, '#3aa0ff'); gb.addColorStop(1, '#0a2a6a'); ctx.fillStyle = gb; ctx.fill(); });
  const lx = x + h * .62, lw = w - h * .62 - 10, ly = y + 8, lh = h - 16;
  caps(lx, ly, lw, lh, 6); ctx.fillStyle = '#05070f'; ctx.fill(); ctx.strokeStyle = '#1a2a4a'; ctx.stroke();
  ctx.fillStyle = '#7fd8ff'; ctx.shadowColor = '#3ab0ff'; ctx.shadowBlur = 5;
  for (let k = 0; k < 9; k++) ctx.fillRect(lx + 12 + k * 26, ly + 9, 20, 3);
  ctx.font = `bold ${lh * .28}px Menlo, monospace`; ctx.textBaseline = 'alphabetic';
  ctx.fillText(piscar ? relogio : relogio.replace(':', ' '), lx + 12, ly + lh - 12);
  ctx.font = `${lh * .22}px Menlo, monospace`;
  ctx.fillText('item: ' + item, lx + 12 + lh * 1.6, ly + lh - 13);
  ctx.fillText('curses: ' + maldicao, lx + 12 + lh * 4.4, ly + lh - 13);
  ctx.fillStyle = '#ff3b4f'; ctx.shadowColor = '#ff3b4f'; ctx.textAlign = 'right'; ctx.font = `bold ${lh * .3}px Menlo, monospace`;
  ctx.fillText(cara, lx + lw - 12, ly + lh * .62);
  ctx.restore();
}

// pager pendurado num chaveiro, tela verde
function pager(ctx, x, y, s, tela, balanco) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(balanco); ctx.scale(s, s);
  // corrente e argola
  ctx.strokeStyle = '#c9ccd4'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 150, 12, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#ff6fd8'; ctx.beginPath(); ctx.moveTo(-6, 170); ctx.lineTo(-30, 196); ctx.lineTo(-10, 190); ctx.lineTo(-4, 214); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#b8e0ff'; ctx.beginPath(); ctx.moveTo(6, 168); ctx.lineTo(26, 200); ctx.lineTo(10, 194); ctx.closePath(); ctx.fill();
  // corpo
  const g = ctx.createLinearGradient(-50, 0, 50, 0); g.addColorStop(0, '#8a8e86'); g.addColorStop(.4, '#d8dccf'); g.addColorStop(1, '#6a6e66');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-48, -10, 96, 150, 18); ctx.fill(); ctx.strokeStyle = '#2a2e2a'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#1a1e1a'; ctx.beginPath(); ctx.roundRect(-36, 8, 72, 66, 6); ctx.fill();
  ctx.fillStyle = '#58ff6a'; ctx.shadowColor = '#58ff6a'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.roundRect(-30, 14, 60, 54, 4); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#0a2a0e'; ctx.font = 'bold 15px Menlo, monospace'; ctx.textAlign = 'center';
  tela.forEach((l, k) => ctx.fillText(l, 0, 34 + k * 18));
  ctx.fillStyle = '#ff2a3a'; ctx.beginPath(); ctx.arc(-38, 0, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2a2e2a'; ctx.beginPath(); ctx.roundRect(-26, 88, 52, 34, 6); ctx.fill();
  ctx.fillStyle = '#8a5cff'; ctx.beginPath(); ctx.moveTo(-10, 94); ctx.lineTo(10, 94); ctx.lineTo(0, 116); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// texto serifado brilhante (telas de LAYER), com aberração de cor
function serifa(ctx, txt, x, y, tam, alinhar = 'left', tremor = 0) {
  ctx.save(); ctx.font = `${tam}px "Times New Roman", "Georgia", serif`; ctx.textAlign = alinhar;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,40,80,.55)'; ctx.fillText(txt, x - 3 - tremor, y);
  ctx.fillStyle = 'rgba(40,160,255,.55)'; ctx.fillText(txt, x + 3 + tremor, y);
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowColor = '#bfffd0'; ctx.shadowBlur = tam * .25; ctx.fillStyle = '#eafff0'; ctx.fillText(txt, x, y);
  ctx.restore();
}

// fatias de glitch: desloca faixas horizontais do quadro
function glitch(ctx, W, H, forca, semente0) {
  let s0 = semente0; const r0 = () => { s0 = (s0 * 16807) % 2147483647; return s0 / 2147483647; };
  for (let k = 0; k < forca; k++) { const y = r0() * H | 0, hh = 2 + r0() * 14 | 0, dx = (r0() - .5) * 40 | 0; ctx.drawImage(ctx.canvas, 0, y, W, hh, dx, y, W, hh); }
}

// caixa de diálogo: faixa clara embaixo, texto azul-escuro e um tentáculo na borda
function dialogo(ctx, W, H, txt, t) {
  ctx.save();
  const g = ctx.createLinearGradient(0, H - 120, 0, H); g.addColorStop(0, 'rgba(220,226,255,0)'); g.addColorStop(.45, 'rgba(220,226,255,.75)'); g.addColorStop(1, 'rgba(240,242,255,.95)');
  ctx.fillStyle = g; ctx.fillRect(0, H - 120, W, 120);
  ctx.font = '26px "Trebuchet MS", sans-serif'; ctx.fillStyle = '#1a1f5a'; ctx.textAlign = 'center';
  ctx.fillText(txt, W / 2, H - 34);
  // tentáculo ciano ondulando no canto
  ctx.lineCap = 'round';
  [[18, '#0e3a4a'], [12, '#3ac8d8'], [5, '#bff6ff']].forEach(([lw, cor]) => { ctx.lineWidth = lw; ctx.strokeStyle = cor; ctx.beginPath();
    for (let k = 0; k <= 20; k++) { const u = k / 20, x = W - 20 - u * 150 + Math.sin(u * 6 + t * TAU) * 14, y = H - u * 170; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); });
  ctx.restore();
}

// coração de carne cheio de veias
function coracaoCarne(iw, ih) {
  const gr = new THREE.Group();
  const g = new THREE.IcosahedronGeometry(1, 1); const p = g.attributes.position;
  for (let k = 0; k < p.count; k++) { const v = new THREE.Vector3().fromBufferAttribute(p, k); const f = 1 + Math.sin(v.x * 4 + v.y * 3) * .12; p.setXYZ(k, v.x * f * 1.05, v.y * f * (v.y < 0 ? 1.25 : 1), v.z * f * .9); }
  g.computeVertexNormals();
  gr.add(new THREE.Mesh(g, psx(iw, ih, { map: sujo('#b0407a', 32, 50, veias), flatShading: true })));
  const vaso = psx(iw, ih, { map: sujo('#6a2a8a', 16, 40), flatShading: true });
  [[.35, .9, .2, -.3], [-.2, 1, -.1, .25], [.05, .95, .35, 0]].forEach(([x, y, z, rz]) => { const v = new THREE.Mesh(new THREE.CylinderGeometry(.14, .2, .8, 5), vaso); v.position.set(x, y, z); v.rotation.z = rz; gr.add(v); });
  const pernas = [];
  for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; const l = new THREE.Mesh(new THREE.CylinderGeometry(.03, .05, 1.1, 3), psx(iw, ih, { color: 0x2a1020 })); l.position.set(Math.cos(a) * .7, -.9, Math.sin(a) * .5); l.rotation.set(Math.sin(a) * .5, 0, -Math.cos(a) * .5); gr.add(l); pernas.push(l); }
  gr.userData.pernas = pernas;
  return gr;
}

// ---------- peças low-poly ----------
function coracao(cor, iw, ih) {
  const s = new THREE.Shape();
  s.moveTo(0, -1.0);
  s.bezierCurveTo(-0.2, -0.6, -1.2, -0.3, -1.1, 0.35);
  s.bezierCurveTo(-1.0, 1.0, -0.2, 1.0, 0, 0.5);
  s.bezierCurveTo(0.2, 1.0, 1.0, 1.0, 1.1, 0.35);
  s.bezierCurveTo(1.2, -0.3, 0.2, -0.6, 0, -1.0);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.5, bevelEnabled: true, bevelSize: .18, bevelThickness: .2, bevelSegments: 1, curveSegments: 3 });
  g.center();
  return new THREE.Mesh(g, psx(iw, ih, { color: cor, emissive: 0x5a0830, flatShading: true }));
}

const papelFlorido = () => textura(32, 32, (c, w, h) => {
  c.fillStyle = '#e9d97a'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#d9c763'; for (let x = 0; x < w; x += 8) c.fillRect(x, 0, 2, h);
  const flor = (fx, fy, cor) => { c.fillStyle = cor; [[0, -2], [2, 0], [0, 2], [-2, 0]].forEach(([a, b]) => c.fillRect(fx + a - 1, fy + b - 1, 3, 3)); c.fillStyle = '#ffef9a'; c.fillRect(fx - 1, fy - 1, 2, 2); };
  flor(8, 8, '#f07aa8'); flor(24, 22, '#8fb6f0'); flor(22, 6, '#f39bbd'); flor(6, 25, '#f07aa8');
  c.fillStyle = '#6fa85a'; c.fillRect(11, 10, 3, 1); c.fillRect(19, 24, 3, 1);
  const im = c.getImageData(0, 0, w, h), d = im.data;
  for (let k = 0; k < w * h; k++) { const n = (rnd() - .5) * 30 - (k / w > h * .7 ? 18 : 0); d[k * 4] += n; d[k * 4 + 1] += n; d[k * 4 + 2] += n * .8; }
  c.putImageData(im, 0, 0);
  c.fillStyle = 'rgba(70,40,20,.22)'; c.fillRect(rnd() * w | 0, 0, 3, h);
});

// =============== CENA 1: a casa no sonho (banner) ===============
function cenaHeroi() {
