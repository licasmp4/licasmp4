<!doctype html>
<html><head><meta charset="utf-8">
<style>body{margin:0;background:transparent}canvas{display:block}</style>
<script src="node_modules/three/build/three.min.js"></script>
</head><body>
<canvas id="out"></canvas>
<script>
// Cenas low-poly com cara de PS1/PS2 pro perfil. Cada cena expõe window.N e window.quadro(i) → dataURL.
const Q = new URLSearchParams(location.search);
const CENA = Q.get('cena') || 'heroi';
const TAU = Math.PI * 2;

// ---------- utilitários ----------
let semente = 7;
const rnd = () => { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; };

function textura(w, h, desenha) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  desenha(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// material com "tremida" de vértice do PS1 (posição presa numa grade de baixa resolução)
function psx(iw, ih, params, tipo = 'lambert') {
  const M = tipo === 'basic' ? THREE.MeshBasicMaterial : THREE.MeshLambertMaterial;
  const m = new M(params);
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>',
      `#include <project_vertex>
       vec2 grade = vec2(${(iw / 2).toFixed(1)}, ${(ih / 2).toFixed(1)});
       gl_Position.xy = floor(gl_Position.xy / gl_Position.w * grade + 0.5) / grade * gl_Position.w;`);
  };
  return m;
}

// pós: reduz cor (15 bits) com pontilhado Bayer, depois amplia sem suavizar
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function montar(gl, iw, ih, S, out, ctx) {
  const pc = montar.pc || (montar.pc = document.createElement('canvas'));
  pc.width = iw; pc.height = ih;
  const px = pc.getContext('2d');
  px.drawImage(gl, 0, 0);
  const im = px.getImageData(0, 0, iw, ih), d = im.data;
  for (let y = 0; y < ih; y++) for (let x = 0; x < iw; x++) {
    const k = (y * iw + x) * 4, b = (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5) * 8;
    for (let c = 0; c < 3; c++) d[k + c] = Math.max(0, Math.min(255, Math.round((d[k + c] + b) / 8) * 8));
  }
  px.putImageData(im, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(pc, 0, 0, iw * S, ih * S);
}

function renderer(iw, ih) {
  const gl = document.createElement('canvas');
  const r = new THREE.WebGLRenderer({ canvas: gl, antialias: false, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(iw, ih, false);
  return r;
}

// texto Y2K cromado
function cromado(ctx, txt, x, y, tam, alinhar = 'left', brilho = null) {
  ctx.save();
  ctx.font = `italic 900 ${tam}px "Arial Black", "Helvetica Neue", sans-serif`;
  ctx.textAlign = alinhar; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.shadowColor = '#ff4fb6'; ctx.shadowBlur = tam * 0.28;
  ctx.lineWidth = tam * 0.16; ctx.strokeStyle = '#1a1446'; ctx.strokeText(txt, x, y);
  ctx.shadowBlur = 0;
  const g = ctx.createLinearGradient(0, y - tam, 0, y);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.45, '#bfe8ff'); g.addColorStop(.5, '#6f86c9'); g.addColorStop(.75, '#e6f4ff'); g.addColorStop(1, '#9fb3e8');
  ctx.fillStyle = g; ctx.fillText(txt, x, y);
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.strokeText(txt, x, y);
  ctx.restore();
  if (brilho === null || brilho < 0 || brilho > 1) return;
  // faixa de luz atravessando as letras
  const oc = cromado.oc || (cromado.oc = document.createElement('canvas'));
  oc.width = ctx.canvas.width; oc.height = ctx.canvas.height;
  const o = oc.getContext('2d');
  o.font = `italic 900 ${tam}px "Arial Black", "Helvetica Neue", sans-serif`; o.textAlign = alinhar;
  o.fillStyle = '#fff'; o.fillText(txt, x, y);
  o.globalCompositeOperation = 'source-in';
  const larg = o.measureText(txt).width, x0 = alinhar === 'left' ? x : x - larg / 2;
  const bx = x0 - tam + (larg + tam * 2) * brilho;
  const gb = o.createLinearGradient(bx - tam * .5, 0, bx + tam * .5, 0);
  gb.addColorStop(0, 'rgba(255,255,255,0)'); gb.addColorStop(.5, 'rgba(255,255,255,.95)'); gb.addColorStop(1, 'rgba(255,255,255,0)');
  o.fillStyle = gb; o.fillRect(0, 0, oc.width, oc.height);
  ctx.drawImage(oc, 0, 0);
}

// faixa de luz sobre um texto já desenhado (fonte dos títulos dos cartões)
function brilhoTexto(ctx, txt, x, y, tam, pos) {
  if (pos < 0 || pos > 1) return;
  const oc = brilhoTexto.oc || (brilhoTexto.oc = document.createElement('canvas'));
  oc.width = ctx.canvas.width; oc.height = ctx.canvas.height;
  const o = oc.getContext('2d');
  o.font = `italic 900 ${tam}px "Arial Black", sans-serif`; o.fillStyle = '#fff'; o.fillText(txt, x, y);
  o.globalCompositeOperation = 'source-in';
  const larg = o.measureText(txt).width, bx = x - tam + (larg + tam * 2) * pos;
  const g = o.createLinearGradient(bx - tam * .6, 0, bx + tam * .6, 0);
  g.addColorStop(0, 'rgba(255,138,192,0)'); g.addColorStop(.5, 'rgba(255,210,235,1)'); g.addColorStop(1, 'rgba(255,138,192,0)');
  o.fillStyle = g; o.fillRect(0, 0, oc.width, oc.height);
  ctx.drawImage(oc, 0, 0);
}

// neve/poeira: pontos que caem e voltam pro topo (laço fechado em N quadros)
function flocos(n, caixa, tam, cor) {
  const g = new THREE.BufferGeometry(), base = [];
  for (let k = 0; k < n; k++) base.push([caixa[0] + rnd() * (caixa[1] - caixa[0]), rnd(), caixa[4] + rnd() * (caixa[5] - caixa[4]), rnd() * TAU, 1 + (rnd() * 2 | 0)]);
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: cor, size: tam, sizeAttenuation: false }));
  p.mover = (t, sobe = false) => {
    const a = g.attributes.position;
    base.forEach(([x, y0, z, f, v], k) => {
      let y = (y0 + (sobe ? 1 : -1) * t * v) % 1; if (y < 0) y += 1;
      a.setXYZ(k, x + Math.sin(t * TAU * v + f) * .4, caixa[2] + y * (caixa[3] - caixa[2]), z);
    });
    a.needsUpdate = true;
  };
  return p;
}

// legenda amarela de jogo (contorno preto)
function legenda(ctx, txt, x, y, tam) {
  ctx.save();
  ctx.font = `${tam}px "Trebuchet MS", "Verdana", sans-serif`; ctx.textAlign = 'center';
  ctx.lineWidth = tam * 0.22; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round'; ctx.strokeText(txt, x, y);
  ctx.fillStyle = '#ffe23a'; ctx.fillText(txt, x, y);
  ctx.restore();
}

// aparelhinho Y2K com tela LCD (relógio + kaomoji)
function aparelho(ctx, x, y, w, h, relogio, cara, piscar) {
  ctx.save();
  const r = h / 2;
  const caps = (px, py, pw, ph, rr) => { ctx.beginPath(); ctx.roundRect(px, py, pw, ph, rr); };
  caps(x, y, w, h, r);
  let g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#f4f7ff'); g.addColorStop(.5, '#a9b6d6'); g.addColorStop(1, '#6d7ba6');
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#26305e'; ctx.stroke();
  caps(x + 6, y + 6, w - 12, h - 12, r - 6); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5; ctx.stroke();
  // botões
  [['#3a7bff', 0], ['#ff5fae', 1]].forEach(([c, i]) => {
    ctx.beginPath(); ctx.arc(x + r + i * (h * .42), y + h / 2, h * .16, 0, TAU);
    const gb = ctx.createRadialGradient(x + r + i * (h * .42) - 3, y + h / 2 - 3, 1, x + r + i * (h * .42), y + h / 2, h * .16);
    gb.addColorStop(0, '#fff'); gb.addColorStop(.35, c); gb.addColorStop(1, '#101848');
    ctx.fillStyle = gb; ctx.fill();
  });
  // LCD verde
  const lx = x + h * 1.25, lw = w - h * 1.25 - r * .9, ly = y + h * .2, lh = h * .6;
  caps(lx, ly, lw, lh, 6); ctx.fillStyle = '#0d2a14'; ctx.fill();
  caps(lx + 3, ly + 3, lw - 6, lh - 6, 4); ctx.fillStyle = '#123b1c'; ctx.fill();
  ctx.font = `bold ${lh * .62}px Menlo, monospace`; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#7dff8a'; ctx.shadowColor = '#7dff8a'; ctx.shadowBlur = 6;
  ctx.fillText(piscar ? relogio : relogio.replace(':', ' '), lx + 12, ly + lh / 2 + 1);
  ctx.fillStyle = '#ff6fb8'; ctx.shadowColor = '#ff6fb8'; ctx.textAlign = 'right';
  ctx.fillText(cara, lx + lw - 12, ly + lh / 2 + 1);
  ctx.restore();
}

function scan(ctx, W, H, forca = .14) {
  ctx.save(); ctx.fillStyle = `rgba(0,0,0,${forca})`;
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .7);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); ctx.restore();
}

// ---------- peças low-poly ----------
function coracao(cor, iw, ih) {
  const s = new THREE.Shape();
  s.moveTo(0, -1.0);
  s.bezierCurveTo(-0.2, -0.6, -1.2, -0.3, -1.1, 0.35);
  s.bezierCurveTo(-1.0, 1.0, -0.2, 1.0, 0, 0.5);
  s.bezierCurveTo(0.2, 1.0, 1.0, 1.0, 1.1, 0.35);
  s.bezierCurveTo(1.2, -0.3, 0.2, -0.6, 0, -1.0);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.5, bevelEnabled: true, bevelSize: .18, bevelThickness: .2, bevelSegments: 1, curveSegments: 3 });
  g.center();
  return new THREE.Mesh(g, psx(iw, ih, { color: cor, emissive: 0x5a0830, flatShading: true }));
}

const papelFlorido = () => textura(32, 32, (c, w, h) => {
  c.fillStyle = '#e9d97a'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#d9c763'; for (let x = 0; x < w; x += 8) c.fillRect(x, 0, 2, h);
  const flor = (fx, fy, cor) => { c.fillStyle = cor; [[0, -2], [2, 0], [0, 2], [-2, 0]].forEach(([a, b]) => c.fillRect(fx + a - 1, fy + b - 1, 3, 3)); c.fillStyle = '#ffef9a'; c.fillRect(fx - 1, fy - 1, 2, 2); };
  flor(8, 8, '#f07aa8'); flor(24, 22, '#8fb6f0'); flor(22, 6, '#f39bbd'); flor(6, 25, '#f07aa8');
  c.fillStyle = '#6fa85a'; c.fillRect(11, 10, 3, 1); c.fillRect(19, 24, 3, 1);
});

// =============== CENA 1: a casa no sonho (banner) ===============
function cenaHeroi() {
  const IW = 400, IH = 150, S = 3, W = IW * S, H = IH * S;
  const out = document.getElementById('out'); out.width = W; out.height = H; const ctx = out.getContext('2d');
  const r = renderer(IW, IH); const cena = new THREE.Scene();
  cena.fog = new THREE.Fog(0xf2a98a, 14, 60);
  const cam = new THREE.PerspectiveCamera(48, IW / IH, .1, 200);
  // céu
  const ceu = textura(4, 64, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#161447'); g.addColorStop(.45, '#5b3d8f'); g.addColorStop(.7, '#e98a8a'); g.addColorStop(1, '#ffd2a1'); c.fillStyle = g; c.fillRect(0, 0, w, h); });
  ceu.wrapT = THREE.ClampToEdgeWrapping;
  const esfera = new THREE.Mesh(new THREE.SphereGeometry(90, 12, 8), new THREE.MeshBasicMaterial({ map: ceu, side: THREE.BackSide, fog: false }));
  cena.add(esfera);
  // lua
  const lua = new THREE.Mesh(new THREE.CircleGeometry(5, 10), new THREE.MeshBasicMaterial({ color: 0xfff1d6, fog: false }));
  lua.position.set(-28, 22, -60); cena.add(lua);
  // estrelas
  const est = new THREE.Group();
  for (let i = 0; i < 60; i++) { const s = new THREE.Mesh(new THREE.PlaneGeometry(.35, .35), new THREE.MeshBasicMaterial({ color: rnd() > .5 ? 0xffffff : 0xffb8e0, fog: false })); const a = rnd() * TAU, e = .35 + rnd() * .9; s.position.set(Math.cos(a) * 80 * Math.cos(e), 80 * Math.sin(e), Math.sin(a) * 80 * Math.cos(e)); s.lookAt(0, 0, 0); est.add(s); }
  cena.add(est);
  // chão: neve azulada pontilhada
  const neve = textura(32, 32, (c, w, h) => { c.fillStyle = '#c9d6f2'; c.fillRect(0, 0, w, h); for (let i = 0; i < 120; i++) { c.fillStyle = ['#b2c1e6', '#e3ebff', '#a4b4dc'][i % 3]; c.fillRect(rnd() * w | 0, rnd() * h | 0, 2, 1); } });
  neve.repeat.set(30, 30);
  const chao = new THREE.Mesh(new THREE.PlaneGeometry(200, 200, 20, 20), psx(IW, IH, { map: neve }));
  chao.rotation.x = -Math.PI / 2; cena.add(chao);
  // casa
  const parede = textura(16, 16, (c, w, h) => { c.fillStyle = '#d8d2e6'; c.fillRect(0, 0, w, h); c.fillStyle = '#bdb4d2'; for (let y = 0; y < h; y += 4) c.fillRect(0, y, w, 1); });
  parede.repeat.set(3, 2);
  const casa = new THREE.Group();
  const corpo = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 5), psx(IW, IH, { map: parede })); corpo.position.y = 2; casa.add(corpo);
  const telhado = new THREE.Mesh(new THREE.ConeGeometry(4.9, 2.6, 4), psx(IW, IH, { color: 0x4a2f5e, flatShading: true }));
  telhado.position.y = 5.3; telhado.rotation.y = Math.PI / 4; telhado.scale.set(1.25, 1, 1.05); casa.add(telhado);
  const chamine = new THREE.Mesh(new THREE.BoxGeometry(.7, 1.6, .7), psx(IW, IH, { color: 0x6b4a6e })); chamine.position.set(1.6, 6, -.8); casa.add(chamine);
  const porta = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 2), psx(IW, IH, { color: 0x2b1a2e })); porta.position.set(0, 1, 2.51); casa.add(porta);
  const janelas = [];
  [[-1.9, 2.6], [1.9, 2.6]].forEach(([x, y]) => { const j = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1), new THREE.MeshBasicMaterial({ color: 0xffe38a })); j.position.set(x, y, 2.51); casa.add(j); janelas.push(j); });
  const jl = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1), new THREE.MeshBasicMaterial({ color: 0xff8fc8 })); jl.position.set(3.01, 2.6, 0); jl.rotation.y = Math.PI / 2; casa.add(jl); janelas.push(jl);
  cena.add(casa);
  // cerca de madeira torta
  const madeira = psx(IW, IH, { color: 0x6e5a4a });
  for (let i = -9; i <= 9; i++) { if (Math.abs(i) < 2) continue; const t = new THREE.Mesh(new THREE.BoxGeometry(.25, 1.4 + rnd() * .6, .15), madeira); t.position.set(i * .7, .7, 6); t.rotation.z = (rnd() - .5) * .25; cena.add(t); }
  const travessa = new THREE.Mesh(new THREE.BoxGeometry(13, .12, .1), madeira); travessa.position.set(0, 1, 6); cena.add(travessa);
  // árvores secas
  const tronco = psx(IW, IH, { color: 0x3a2c3a, flatShading: true });
  [[-9, -4], [8.5, -3], [-13, 3], [12, 4], [-5, -12], [6, -14]].forEach(([x, z]) => {
    const g = new THREE.Group(); const h = 4 + rnd() * 3;
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(.15, .35, h, 4), tronco); tr.position.y = h / 2; g.add(tr);
    for (let k = 0; k < 4; k++) { const ga = new THREE.Mesh(new THREE.CylinderGeometry(.05, .12, 1.8, 3), tronco); ga.position.set(0, h * (.55 + k * .1), 0); ga.rotation.set((rnd() - .5) * 1.6, rnd() * TAU, .9 + rnd() * .5); ga.translateY(.8); g.add(ga); }
    g.position.set(x, 0, z); cena.add(g);
  });
  // poste com fio
  const poste = new THREE.Mesh(new THREE.CylinderGeometry(.12, .15, 7, 4), tronco); poste.position.set(-6, 3.5, 3); cena.add(poste);
  const lamp = new THREE.Mesh(new THREE.BoxGeometry(.5, .25, .3), new THREE.MeshBasicMaterial({ color: 0xfff3c4 })); lamp.position.set(-5.6, 6.8, 3); cena.add(lamp);
  // coração flutuante gigante
  const cor = coracao(0xff4f9a, IW, IH); cor.scale.setScalar(1.6); cena.add(cor);
  // pessoa-sombra parada entre as árvores
  const sombra = new THREE.Group(); const preto = new THREE.MeshBasicMaterial({ color: 0x0c0614 });
  const sc = new THREE.Mesh(new THREE.BoxGeometry(.7, 2.6, .35), preto); sc.position.y = 1.3; sombra.add(sc);
  const sh = new THREE.Mesh(new THREE.BoxGeometry(.5, .55, .45), preto); sh.position.y = 2.95; sombra.add(sh);
  const olhos = new THREE.Mesh(new THREE.PlaneGeometry(.32, .06), new THREE.MeshBasicMaterial({ color: 0xff3b6b })); olhos.position.set(0, 3.0, .24); sombra.add(olhos);
  sombra.scale.set(1.15, 1.35, 1.15); sombra.position.set(9.5, 0, -6); sombra.lookAt(0, 0, 14); cena.add(sombra);
  window.__sombra = [sombra, olhos];
  // luz
  cena.add(new THREE.HemisphereLight(0xffd6e8, 0x4a4a8a, .9));
  const sol = new THREE.DirectionalLight(0xffe0c0, .8); sol.position.set(-10, 12, 8); cena.add(sol);
  const luzCor = new THREE.PointLight(0xff4fa0, 1.4, 14); cena.add(luzCor);
  // neve caindo (duas camadas)
  const neve1 = flocos(260, [-22, 22, 0, 13, -16, 12], 1, 0xffffff), neve2 = flocos(90, [-14, 14, 0, 11, -6, 11], 2, 0xffe6f4);
  cena.add(neve1, neve2);
  // fumaça da chaminé
  const fumaca = [];
  for (let k = 0; k < 5; k++) { const f = new THREE.Mesh(new THREE.DodecahedronGeometry(.45, 0), psx(IW, IH, { color: 0xc7bde0, transparent: true, flatShading: true })); cena.add(f); fumaca.push(f); }
  // brilhos em volta do coração
  const brilhos = [];
  for (let k = 0; k < 6; k++) { const b = new THREE.Mesh(new THREE.OctahedronGeometry(.16, 0), new THREE.MeshBasicMaterial({ color: k % 2 ? 0xffffff : 0xffb8e0 })); cena.add(b); brilhos.push(b); }

  window.N = 96;
  window.quadro = (i) => {
    const t = i / window.N;
    const a = -0.35 + Math.sin(t * TAU) * .32;
    cam.position.set(Math.sin(a) * 17, 4.2 + Math.sin(t * TAU * 2) * .25, Math.cos(a) * 17);
    cam.lookAt(-3.2, 4.6, 0);
    cor.position.set(.4, 9.0 + Math.sin(t * TAU) * .45, 0); cor.rotation.y = t * TAU; luzCor.position.copy(cor.position);
    const bate = 1.6 * (1 + Math.max(0, Math.sin(t * TAU * 4)) ** 8 * .12); cor.scale.setScalar(bate);
    neve1.mover(t); neve2.mover(t);
    fumaca.forEach((f, k) => { const fa = (t * 2 + k / 5) % 1; f.position.set(1.6 + fa * 1.4 + Math.sin(fa * 5) * .2, 7 + fa * 4, -.8 - fa * .6); f.scale.setScalar(.6 + fa * 1.4); f.material.opacity = .85 * (1 - fa); f.rotation.set(fa * 3, fa * 2, 0); });
    brilhos.forEach((b, k) => { const ba = t * TAU * 2 + k * TAU / 6; b.position.set(cor.position.x + Math.cos(ba) * 2.6, cor.position.y + Math.sin(ba * 1.5) * .9, cor.position.z + Math.sin(ba) * 2.6); b.rotation.y = ba * 2; b.visible = (i + k * 3) % 8 < 6; });
    janelas.forEach((j, k) => { j.material.color.setHex(((i + k * 7) % 23 < 2) ? 0x3a2a40 : (k === 2 ? 0xff8fc8 : 0xffe38a)); });
    window.__sombra[0].visible = !(i % 24 >= 20); window.__sombra[1].visible = (i % 24 < 10);
    lamp.material.color.setHex((i % 31 === 4 || i % 31 === 6) ? 0x554a40 : 0xfff3c4);
    r.render(cena, cam);
    montar(r.domElement, IW, IH, S, out, ctx);
    // interface
    cromado(ctx, 'licas.mp3', 52, 128, 92, 'left', (t * 2 % 1) * 1.6 - .3);
    ctx.save(); ctx.font = 'bold 22px Menlo, monospace'; ctx.fillStyle = '#ffe7f4'; ctx.shadowColor = '#ff4fb6'; ctx.shadowBlur = 10;
    ctx.fillText('dev full stack  ·  ia  ·  jogos estranhos', 60, 170); ctx.restore();
    legenda(ctx, 'o sonho continua.', W / 2, H - 34, 30);
    const seg = 44 + Math.floor(t * 6);
    aparelho(ctx, W - 380, 28, 350, 74, `02:${String(seg).padStart(2, '0')}`, i % 32 < 3 ? '(-ω-)' : '(˘ω˘)', i % 12 < 6);
    scan(ctx, W, H);
    return out.toDataURL('image/png');
  };
}

// =============== CENA 2: objeto girando no cartão "memory" ===============
function cartao() {
